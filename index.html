<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Team Health Check</title>
<style>
:root{--bg:#0a1628;--surface:#111f35;--surface2:#172540;--accent:#00c896;--yellow:#f4a261;--red:#e63946;--text:#e8edf5;--muted:#6b7fa3;--border:rgba(255,255,255,0.08);--green:#00c896;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.nb{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.05rem;color:var(--accent)}
.nd{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.nu{display:flex;align-items:center;gap:1rem;font-size:.85rem;color:var(--muted)}
.btn{background:var(--accent);color:#000;border:none;padding:.5rem 1.2rem;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-size:.9rem}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-r{background:var(--red);color:#fff}
main{max-width:900px;margin:2rem auto;padding:0 1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem}
.pg{display:none}
.pg.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem}
.field{margin-bottom:1.2rem}
.field label{display:block;margin-bottom:.5rem;font-size:.85rem;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.75rem;color:var(--text);outline:none;font-size:.95rem}
input:focus{border-color:var(--accent)}
.t-row{display:flex;align-items:center;justify-content:space-between;padding:1rem;border-bottom:1px solid var(--border)}
.t-row:last-child{border:0}
.t-info h4{font-size:.95rem;margin-bottom:.2rem}
.t-info p{font-size:.8rem;color:var(--muted)}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase}
.b-live{background:rgba(0,200,150,0.1);color:var(--accent)}
.b-done{background:rgba(107,127,163,0.1);color:var(--muted)}
.q-card{margin-bottom:2rem}
.q-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}
.q-ico{font-size:1.5rem;width:48px;height:48px;background:var(--surface2);display:flex;align-items:center;justify-content:center;border-radius:12px}
.q-opt{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.q-opt label{cursor:pointer;text-align:center;background:var(--surface2);border:1px solid var(--border);padding:.8rem .4rem;border-radius:10px;transition:.2s;position:relative}
.q-opt input{position:absolute;opacity:0}
.q-opt input:checked+span{color:var(--accent);font-weight:700}
.q-opt label:has(input:checked){border-color:var(--accent);background:rgba(0,200,150,0.05)}
.opt-desc{display:block;font-size:.65rem;margin-top:.3rem;color:var(--muted)}
.res-bar-w{height:8px;background:var(--surface2);border-radius:10px;margin-top:.5rem;overflow:hidden}
.res-bar{height:100%;border-radius:10px;transition:1s cubic-bezier(0.4,0,0.2,1)}
.res-item{margin-bottom:1.2rem}
.res-stat{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.3rem}
.hidden{display:none}
.loading{opacity:0.6;pointer-events:none}
</style>
</head>
<body>

<nav>
  <div class="nb"><div class="nd"></div> Team Health Check</div>
  <div class="nu">
    <span id="nav-u"></span>
    <a href="#" id="nav-out" class="hidden" onclick="logout()">Sign Out</a>
  </div>
</nav>

<main>
  <div id="page-auth" class="pg">
    <div class="card" style="max-width:400px;margin:4rem auto">
      <h2 style="margin-bottom:1.5rem">Admin Login</h2>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="auth-e" placeholder="admin@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="auth-p" placeholder="••••••••">
      </div>
      <button class="btn" style="width:100%" onclick="login()">Sign In</button>
      <p id="auth-err" style="color:var(--red);font-size:.8rem;margin-top:1rem;text-align:center"></p>
    </div>
  </div>

  <div id="page-dashboard" class="pg">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
      <h3>Active & Past Sessions</h3>
      <button class="btn" onclick="showPage('create-session')">New Session</button>
    </div>
    <div id="session-list" class="grid"></div>
  </div>

  <div id="page-create-session" class="pg">
    <div class="card" style="max-width:500px;margin:0 auto">
      <h3 style="margin-bottom:1.5rem">Create Health Session</h3>
      <div class="field">
        <label>Year</label>
        <input type="number" id="s-year" value="2026">
      </div>
      <div class="field">
        <label>Quarter</label>
        <select id="s-q">
          <option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option>
        </select>
      </div>
      <div class="field">
        <label>Sprint Name / Identifier</label>
        <input type="text" id="s-name" placeholder="e.g. Sprint 24.1">
      </div>
      <div style="display:flex;gap:1rem">
        <button class="btn" style="flex:1" onclick="createSession()">Create & Start</button>
        <button class="btn btn-s" onclick="showPage('dashboard')">Cancel</button>
      </div>
    </div>
  </div>

  <div id="page-session-admin" class="pg">
    <div id="admin-header" style="margin-bottom:1.5rem"></div>
    <div class="grid">
      <div class="card">
        <h4 style="color:var(--muted);margin-bottom:1rem">Live Participation</h4>
        <div style="font-size:2.5rem;font-weight:700" id="stat-count">0</div>
        <div style="font-size:.8rem;color:var(--muted)">Responses received</div>
      </div>
      <div class="card">
        <h4 style="color:var(--muted);margin-bottom:1rem">Share with Team</h4>
        <div class="field">
          <input type="text" id="join-url" readonly style="font-size:.85rem;margin-bottom:.5rem;background:var(--bg)">
          <button class="btn btn-s" style="width:100%" onclick="copyLink()">Copy Join Link</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:1rem;flex-wrap:wrap">
      <button class="btn" id="btn-refresh" onclick="loadAdminSession(S.sid)">Refresh Stats</button>
      <button class="btn btn-s" id="btn-close" onclick="closeSession()">Close & Finalize</button>
      <button class="btn btn-s" id="btn-results" onclick="goResults(S.sid)">View Current Results</button>
    </div>
  </div>

  <div id="page-vote" class="pg">
    <div id="vote-info" style="text-align:center;margin-bottom:2.5rem"></div>
    <div id="questions-list"></div>
    <div class="card">
      <h4 style="margin-bottom:1rem">Additional Comments</h4>
      <textarea id="vote-comment" rows="4" placeholder="Optional: Share thoughts on what went well or what can be improved..."></textarea>
    </div>
    <button class="btn" style="width:100%;padding:1rem;font-size:1.1rem" onclick="submitVote()">Submit Feedback</button>
  </div>

  <div id="page-res" class="pg">
    <div id="res-header" style="text-align:center;margin-bottom:2rem"></div>
    <div id="res-sum" class="grid"></div>
    <div class="card" style="margin-top:1.5rem">
      <h4 style="margin-bottom:1.5rem">Category Breakdown & Trends</h4>
      <div id="res-details"></div>
    </div>
    <div id="res-comm-section" class="card">
      <h4 style="margin-bottom:1rem">Team Comments</h4>
      <div id="res-comments" style="display:flex;flex-direction:column;gap:.8rem"></div>
    </div>
    <div style="display:flex;gap:1rem">
      <button class="btn" style="flex:1" onclick="exportPDF()">Export PDF Report</button>
      <button class="btn btn-s" onclick="showPage('dashboard')">Back</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set, push, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAs8v6_1OQ2Ym2E_eXo_vN2k5M1Xo3Y6v0",
  authDomain: "health-gold-theta.firebaseapp.com",
  databaseURL: "https://health-gold-theta-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "health-gold-theta",
  storageBucket: "health-gold-theta.appspot.com",
  messagingSenderId: "385868846950",
  appId: "1:385868846950:web:8e1d5e3f7f8e8f8e8f8e8f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const cats = [
  {id:'val', name:'Delivering Value', icon:'💎', d1:'We deliver nothing', d5:'High value'},
  {id:'rel', name:'Release Ease', icon:'🚀', d1:'Painful & slow', d5:'Easy & fast'},
  {id:'fun', name:'Fun/Culture', icon:'🥳', d1:'Boring/Stressful', d5:'Great vibes'},
  {id:'hlth', name:'Code Health', icon:'🛠️', d1:'Legacy mess', d5:'Clean & solid'},
  {id:'spd', name:'Speed', icon:'⚡', d1:'Very slow', d5:'Fast flow'},
  {id:'mish', name:'Mission', icon:'🎯', d1:'No clue why', d5:'Clear goals'},
  {id:'own', name:'Ownership', icon:'💪', d1:'Not my job', d5:'We own it'},
  {id:'lrn', name:'Learning', icon:'📚', d1:'Stagnant', d5:'Constant growth'},
  {id:'sup', name:'Support', icon:'🤝', d1:'Alone', d5:'Always helped'},
  {id:'proc', name:'Process', icon:'⚙️', d1:'Bottlenecks', d5:'Smooth lean'}
];

let S = { sid:null, uid:null, role:null };

// --- AUTH LOGIC (MODIFIED FOR ANONYMOUS JOIN) ---
onAuthStateChanged(auth, u => {
  const jc = new URLSearchParams(location.search).get('join');
  if(u) {
    S.uid = u.uid;
    document.getElementById('nav-u').textContent = u.email;
    document.getElementById('nav-out').classList.remove('hidden');
    jc ? directJoin(jc) : (showPage('dashboard'), loadSessions());
  } else {
    S.uid = null;
    document.getElementById('nav-u').textContent = '';
    document.getElementById('nav-out').classList.add('hidden');
    // KRİTİK DEĞİŞİKLİK: Eğer linkte join kodu varsa login isteme
    if(jc) {
      directJoin(jc);
    } else {
      showPage('auth');
    }
  }
});

window.login = () => {
  const e = document.getElementById('auth-e').value, p = document.getElementById('auth-p').value;
  const btn = document.querySelector('#page-auth .btn');
  btn.classList.add('loading');
  signInWithEmailAndPassword(auth,e,p).catch(err => {
    document.getElementById('auth-err').textContent = "Access denied. Check credentials.";
    btn.classList.remove('loading');
  });
};
window.logout = () => signOut(auth).then(() => location.search='');

// --- NAVIGATION ---
window.showPage = (id) => {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  window.scrollTo(0,0);
};

// --- SESSION MANAGEMENT ---
window.createSession = async () => {
  const sn = document.getElementById('s-name').value;
  if(!sn) return alert("Please enter a sprint name");
  const data = {
    name: sn,
    year: document.getElementById('s-year').value,
    q: document.getElementById('s-q').value,
    status: 'live',
    createdAt: Date.now(),
    createdBy: S.uid
  };
  const nr = push(ref(db, 'health-sessions'));
  await set(nr, data);
  showPage('dashboard');
};

window.loadSessions = () => {
  onValue(ref(db, 'health-sessions'), ss => {
    const list = document.getElementById('session-list');
    list.innerHTML = '';
    const data = ss.val();
    if(!data) return;
    Object.keys(data).reverse().forEach(id => {
      const s = data[id];
      const div = document.createElement('div');
      div.className = 'card t-row';
      div.innerHTML = `
        <div class="t-info">
          <span class="badge ${s.status=='live'?'b-live':'b-done'}">${s.status}</span>
          <h4>${s.name}</h4>
          <p>${s.year} ${s.q} • ${new Date(s.createdAt).toLocaleDateString()}</p>
        </div>
        <button class="btn btn-s" onclick="${s.status=='live'?'goAdmin(\''+id+'\')':'goResults(\''+id+'\')'}">
          ${s.status=='live'?'Manage':'Results'}
        </button>
      `;
      list.appendChild(div);
    });
  });
};

// --- DIRECT JOIN LOGIC ---
async function directJoin(sid) {
  const sn = await get(ref(db, `health-sessions/${sid}`));
  if(!sn.exists()) return alert("Session not found.");
  const s = sn.val();
  if(s.status !== 'live') {
    goResults(sid);
    return;
  }
  S.sid = sid;
  renderVotePage(s);
  showPage('vote');
}

window.goAdmin = (sid) => { S.sid = sid; loadAdminSession(sid); showPage('session-admin'); };

async function loadAdminSession(sid) {
  const sn = await get(ref(db, `health-sessions/${sid}`));
  const s = sn.val();
  const res = await get(ref(db, `health-results/${sid}`));
  const votes = res.val() ? Object.values(res.val()) : [];
  
  document.getElementById('admin-header').innerHTML = `<h3>${s.name} <small style="color:var(--muted)">${s.year} ${s.q}</small></h3>`;
  document.getElementById('stat-count').textContent = votes.length;
  document.getElementById('join-url').value = `${location.origin}${location.pathname}?join=${sid}`;
}

window.copyLink = () => {
  const el = document.getElementById('join-url');
  el.select();
  document.execCommand('copy');
  alert("Link copied to clipboard!");
};

// --- VOTING ---
function renderVotePage(s) {
  document.getElementById('vote-info').innerHTML = `<h2>${s.name}</h2><p style="color:var(--muted)">Anonymous Feedback Session</p>`;
  const list = document.getElementById('questions-list');
  list.innerHTML = '';
  cats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'card q-card';
    div.innerHTML = `
      <div class="q-head"><div class="q-ico">${c.icon}</div><div><h4>${c.name}</h4></div></div>
      <div class="q-opt">
        ${[1,2,3,4,5].map(v => `
          <label>
            <input type="radio" name="q-${c.id}" value="${v}">
            <span>${v}</span>
            <span class="opt-desc">${v==1?c.d1:v==5?c.d5:''}</span>
          </label>
        `).join('')}
      </div>
    `;
    list.appendChild(div);
  });
}

window.submitVote = async () => {
  const result = { ratings: {}, comment: document.getElementById('vote-comment').value, ts: Date.now() };
  for(let c of cats) {
    const sel = document.querySelector(`input[name="q-${c.id}"]:checked`);
    if(!sel) return alert(`Please rate: ${c.name}`);
    result.ratings[c.id] = parseInt(sel.value);
  }
  const btn = document.querySelector('#page-vote .btn');
  btn.classList.add('loading');
  await push(ref(db, `health-results/${S.sid}`), result);
  alert("Feedback submitted. Thank you!");
  location.href = location.origin + location.pathname;
};

// --- RESULTS ---
window.goResults = async (sid) => {
  S.sid = sid;
  const sn = await get(ref(db, `health-sessions/${sid}`));
  const s = sn.val();
  const res = await get(ref(db, `health-results/${sid}`));
  const votes = res.val() ? Object.values(res.val()) : [];
  
  if(votes.length === 0) return alert("No results collected yet.");

  const avgs = cats.map(c => {
    const vls = votes.map(v => v.ratings[c.id] || 0).filter(v => v > 0);
    return vls.length ? vls.reduce((a,b)=>a+b,0)/vls.length : 0;
  });

  const allS = await get(ref(db, 'health-sessions'));
  const sArr = Object.keys(allS.val()).map(k => ({...allS.val()[k], id:k}));
  const prevS = sArr.filter(x => x.id !== sid).sort((a,b)=>b.createdAt-a.createdAt)[0];
  
  let prevAvgs = null;
  if(prevS) {
    const pR = await get(ref(db, `health-results/${prevS.id}`));
    if(pR.exists()){
      const pVs = Object.values(pR.val());
      prevAvgs = cats.map(c => {
        const vls = pVs.map(v => v.ratings[c.id]||0).filter(v=>v>0);
        return vls.length ? vls.reduce((a,b)=>a+b,0)/vls.length : 0;
      });
    }
  }

  renderResults(s, votes, avgs, prevAvgs, sArr);
  showPage('res');
};

let _cvs=[], _pvs=[], _sn={}, _vts=[], _cs=[]; 
function renderResults(s, votes, avgs, pAvgs, allSessions) {
  _cvs=avgs; _pvs=pAvgs; _sn=s; _vts=votes; _cs=allSessions;
  document.getElementById('res-header').innerHTML = `<h2>${s.name}</h2><p>${votes.length} Participants</p>`;
  
  const sumDiv = document.getElementById('res-sum');
  sumDiv.innerHTML = '';
  const totalAvg = avgs.filter(v=>v>0).reduce((a,b)=>a+b,0)/avgs.filter(v=>v>0).length;
  sumDiv.innerHTML = `<div class="card" style="grid-column: 1/-1; text-align:center">
    <div style="font-size:3rem; font-weight:800; color:var(--accent)">${totalAvg.toFixed(1)}</div>
    <div style="color:var(--muted); font-size:.9rem">Overall Health Score</div>
  </div>`;

  const detDiv = document.getElementById('res-details');
  detDiv.innerHTML = '';
  cats.forEach((c, i) => {
    const val = avgs[i];
    const prev = pAvgs ? pAvgs[i] : null;
    const diff = prev ? val - prev : 0;
    const color = val >= 4 ? 'var(--green)' : val >= 3 ? 'var(--yellow)' : 'var(--red)';
    const trend = diff > 0.1 ? '↑' : diff < -0.1 ? '↓' : '→';
    
    detDiv.innerHTML += `
      <div class="res-item">
        <div class="res-stat">
          <span>${c.icon} ${c.name}</span>
          <span style="font-weight:700; color:${color}">${val.toFixed(1)} ${prev ? `<small style="color:var(--muted); font-weight:400; margin-left:.4rem">${trend}</small>`:''}</span>
        </div>
        <div class="res-bar-w"><div class="res-bar" style="width:${(val/5)*100}%; background:${color}"></div></div>
      </div>
    `;
  });

  const comms = votes.map(v => v.comment).filter(c => c && c.trim().length > 0);
  const cSec = document.getElementById('res-comm-section');
  if(comms.length > 0) {
    cSec.style.display = 'block';
    document.getElementById('res-comments').innerHTML = comms.map(c => `<div style="padding:.8rem; background:var(--surface2); border-radius:8px; border-left:3px solid var(--accent); font-size:.9rem">"${c}"</div>`).join('');
  } else {
    cSec.style.display = 'none';
  }
}

window.closeSession = async () => {
  if(!confirm("Close this session? No more votes can be submitted.")) return;
  await update(ref(db, `health-sessions/${S.sid}`), { status: 'done' });
  loadSessions();
  showPage('dashboard');
};

// --- PDF EXPORT ---
window.exportPDF = async () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const W = doc.internal.pageSize.getWidth();
  const M = 20;
  let y = 20;

  const ck = (h) => { if(y+h > 280) { doc.addPage(); y=20; } };

  doc.setFillColor(10, 22, 40);
  doc.rect(0, 0, W, 40, 'F');
  doc.setTextColor(0, 200, 150);
  doc.setFontSize(22);
  doc.setFont('helvetica', 'bold');
  doc.text('Team Health Report', M, 26);
  y = 55;

  doc.setTextColor(40, 40, 40);
  doc.setFontSize(16);
  doc.text(_sn.name, M, y);
  y += 8;
  doc.setFontSize(10);
  doc.setTextColor(100, 100, 100);
  doc.text(`${_sn.year} ${_sn.q} • ${_vts.length} Participants`, M, y);
  y += 20;

  cats.forEach((c, i) => {
    ck(20);
    const cv = _cvs[i];
    const pv = _pvs ? _pvs[i] : null;
    const diff = pv ? cv - pv : 0;
    const arrow = diff > 0.1 ? '(Up)' : diff < -0.1 ? '(Down)' : '';
    const rgb2 = cv >= 4 ? [0,180,130] : cv >= 3 ? [220,140,50] : [200,50,60];

    doc.setFillColor(245, 247, 250);
    doc.rect(M, y, W-M*2, 12, 'F');
    doc.setFontSize(10);
    doc.setTextColor(80, 80, 80);
    doc.text(`${c.icon} ${c.name}`, M+3, y+8);
    doc.setTextColor(...rgb2);
    doc.setFont('helvetica', 'bold');
    doc.text(`${cv.toFixed(1)} ${arrow}`, W-M-3, y+8, {align:'right'});
    y += 15;
  });

  if(_cs && _cs.length >= 2) {
    const recent = [..._cs].sort((a,b) => (a.createdAt||0)-(b.createdAt||0)).slice(-5);
    const full = await Promise.all(recent.map(ss => get(ref(db, `health-sessions/${ss.id}`)).then(sn2 => sn2.val())));
    const valid = full.filter(Boolean);
    
    if(valid.length >= 2) {
      ck(30);
      doc.setTextColor(13, 115, 119);
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.text('Sprint Trend (last 5)', M, y);
      y += 8;

      cats.forEach((c, ci) => {
        ck(14);
        doc.setFontSize(8.5);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(60, 60, 60);
        doc.text(`${c.icon} ${c.name}`, M, y);
        const step = (W - M*2 - 40) / valid.length;
        valid.forEach((vs, vi) => {
          const val = (vs.results?.avgs || [])[ci] || 0;
          if(!val) return;
          const rgb3 = val >= 4 ? [0,200,150] : val >= 3 ? [244,162,97] : [230,57,70];
          const bx = M + 40 + (vi * step);
          doc.setFillColor(...rgb3);
          doc.rect(bx, y-3, step-2, 4, 'F');
        });
        y += 8;
      });
    }
  }

  doc.save(`HealthReport_${_sn.name}.pdf`);
};
</script>
</body>
